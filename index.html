<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Art Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Initial Screen -->
  <div id="start-screen" class="screen">
    <div class="start-buttons">
      <button id="btn-new" class="start-btn">Create New</button>
      <button id="btn-open" class="start-btn">Open</button>
    </div>
    <input type="file" id="file-input" accept=".cpxl,.png,.jpg,.jpeg" hidden>
  </div>

  <!-- New Canvas Dialog -->
  <div id="new-dialog" class="dialog hidden">
    <div class="dialog-content">
      <h3>New Canvas</h3>
      <div class="size-inputs">
        <input type="number" id="canvas-width" value="32" min="1" max="256">
        <span>×</span>
        <input type="number" id="canvas-height" value="32" min="1" max="256">
      </div>
      <div class="presets">
        <button class="preset-btn" data-size="16">16</button>
        <button class="preset-btn" data-size="32">32</button>
        <button class="preset-btn" data-size="64">64</button>
      </div>
      <div class="dialog-buttons">
        <button id="btn-cancel-new">Cancel</button>
        <button id="btn-create">Create</button>
      </div>
    </div>
  </div>

  <!-- Main Editor -->
  <div id="editor" class="screen hidden">
    <!-- Top Row -->
    <div class="toolbar top-toolbar">
      <div class="toolbar-left">
        <div class="swatches">
          <button id="swatch-1" class="swatch selected" data-swatch="1" style="background-color: #000000;"></button>
          <button id="swatch-2" class="swatch" data-swatch="2" style="background-color: #ffffff;"></button>
          <button id="swatch-eraser" class="swatch eraser-swatch" data-swatch="eraser" title="Eraser"></button>
          <button id="swatch-picker" class="swatch picker-swatch" title="Color Picker">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.2-.64-1.67-.08-.1-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          </button>
        </div>
      </div>
      <div class="toolbar-right">
        <button id="btn-undo" class="tool-btn" title="Undo">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>
        <button id="btn-redo" class="tool-btn" title="Redo">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
        </button>
        <button id="btn-menu" class="tool-btn" title="Menu">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      <canvas id="grid-overlay"></canvas>
      <canvas id="selection-overlay"></canvas>
      <!-- Selection Floating Toolbar -->
      <div id="selection-toolbar" class="hidden">
        <button id="sel-move" class="sel-btn" title="Move">Move</button>
        <button id="sel-clone" class="sel-btn" title="Clone">Clone</button>
        <button id="sel-delete" class="sel-btn" title="Delete">Delete</button>
      </div>
    </div>

    <!-- Bottom Row -->
    <div class="toolbar bottom-toolbar">
      <div class="toolbar-left">
        <button id="tool-pen" class="tool-btn selected" data-tool="pen" title="Pen">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        <div class="size-control">
          <button id="size-minus" class="size-btn">-</button>
          <input type="number" id="pen-size" value="1" min="1" max="32">
          <button id="size-plus" class="size-btn">+</button>
        </div>
        <button id="tool-fill" class="tool-btn" data-tool="fill" title="Fill">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></svg>
        </button>
        <button id="tool-select" class="tool-btn" data-tool="select" title="Select">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 5h2V3c-1.1 0-2 .9-2 2zm0 8h2v-2H3v2zm4 8h2v-2H7v2zM3 9h2V7H3v2zm10-6h-2v2h2V3zm6 0v2h2c0-1.1-.9-2-2-2zM5 21v-2H3c0 1.1.9 2 2 2zm-2-4h2v-2H3v2zM9 3H7v2h2V3zm2 18h2v-2h-2v2zm8-8h2v-2h-2v2zm0 8c1.1 0 2-.9 2-2h-2v2zm0-12h2V7h-2v2zm0 8h2v-2h-2v2zm-4 4h2v-2h-2v2zm0-16h2V3h-2v2z"/></svg>
        </button>
        <button id="tool-eyedropper" class="tool-btn" data-tool="eyedropper" title="Eyedropper">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.41-1.41-1.42 1.42 1.41 1.41-6.63 6.63a2 2 0 00-.59 1.42V18a1 1 0 001 1h2.12a2 2 0 001.42-.59l6.63-6.63 1.41 1.41 1.42-1.42-1.41-1.41 3.12-3.12a1 1 0 000-1.41zM7.41 18H6v-1.41l6.63-6.63 1.41 1.41L7.41 18z"/></svg>
        </button>
      </div>
      <div class="toolbar-right">
        <button id="btn-grid" class="tool-btn" title="Toggle Grid">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></svg>
        </button>
        <button id="btn-layers" class="tool-btn" title="Layers">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Color Picker Dialog -->
  <div id="color-picker-dialog" class="dialog hidden">
    <div class="dialog-content color-picker-content">
      <button id="close-picker" class="close-btn">×</button>
      <div class="picker-swatches">
        <button id="picker-swatch-1" class="swatch picker-target selected" data-target="1"></button>
        <button id="picker-swatch-2" class="swatch picker-target" data-target="2"></button>
      </div>
      <div id="hsv-picker">
        <div id="saturation-value-picker">
          <canvas id="sv-canvas" width="200" height="150"></canvas>
          <div id="sv-cursor" class="picker-cursor"></div>
        </div>
        <div id="hue-picker">
          <canvas id="hue-canvas" width="200" height="20"></canvas>
          <div id="hue-cursor" class="picker-cursor"></div>
        </div>
      </div>
      <div class="color-preview">
        <div id="preview-color"></div>
        <input type="text" id="hex-input" maxlength="7" placeholder="#000000">
      </div>
    </div>
  </div>

  <!-- Layers Panel -->
  <div id="layers-panel" class="panel hidden">
    <div class="panel-header">
      <span>Layers</span>
      <button id="add-layer" class="small-btn" title="New Layer">+</button>
    </div>
    <div id="layers-list"></div>
  </div>

  <!-- Hamburger Menu -->
  <div id="menu-dropdown" class="dropdown hidden">
    <button id="menu-new">New</button>
    <button id="menu-open">Open</button>
    <button id="menu-save">Save</button>
    <button id="menu-export">Export As</button>
  </div>

  <!-- Unsaved Changes Dialog -->
  <div id="unsaved-dialog" class="dialog hidden">
    <div class="dialog-content">
      <p>You have unsaved changes. Continue?</p>
      <div class="dialog-buttons">
        <button id="unsaved-cancel">Cancel</button>
        <button id="unsaved-continue">Continue</button>
      </div>
    </div>
  </div>

  <!-- Export Dialog -->
  <div id="export-dialog" class="dialog hidden">
    <div class="dialog-content">
      <h3>Export As</h3>
      <select id="export-format">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
      </select>
      <div class="dialog-buttons">
        <button id="export-cancel">Cancel</button>
        <button id="export-confirm">Export</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
